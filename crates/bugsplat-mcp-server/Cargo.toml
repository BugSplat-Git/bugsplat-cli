[package]
name = "bugsplat-mcp-server"
description = "BugSplat's local MCP server: the symbol tools that need the user's disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bugsplat-auth.workspace = true
bugsplat-core.workspace = true
bugsplat-debugid.workspace = true
bugsplat-symbols.workspace = true
bugsplat-upload.workspace = true
# Only the server over stdio: no macros, no HTTP transports, no client.
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
