[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

# Permissive licenses only. A dependency under any other license fails CI, so adding one is a
# decision someone makes here.
[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"
# MPL-2.0 is file-level copyleft: fine for a dependency we use unmodified, so it is allowed
# crate by crate.
exceptions = [{ crate = "option-ext", allow = ["MPL-2.0"] }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
