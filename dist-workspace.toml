[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
# The workspace sets `publish = false` to keep crates off crates.io, which also hides them from dist.
dist = true
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
checksum = "sha256"
# Release builds run only for `v*` version tags, never for pull requests. The namespace is also
# why the generated workflow is named `v-release.yml`.
tag-namespace = "v"
pr-run-mode = "skip"
install-path = "~/.bugsplat/bin"
# The updater downloads from GitHub Releases, which it can't do while the repository is private.
install-updater = false

# Homebrew and npm publishing, switched off until the package names are agreed
# (https://github.com/BugSplat-Git/bugsplat-cli/issues/1, open question 3). To switch them on:
# add "homebrew" and "npm" to `installers`, uncomment these lines and the setup-node pin below,
# set `homepage` for the bugsplat-cli package, create the tap repository, add the
# HOMEBREW_TAP_TOKEN and NPM_TOKEN secrets, and run `dist generate`.
# tap = "BugSplat-Git/homebrew-tap"
# formula = "bugsplat"
# npm-scope = "@bugsplat"
# npm-package = "cli"
# publish-jobs = ["homebrew", "npm"]

# `dist generate` writes these commits into the release workflow. Dependabot skips that file
# (.github/dependabot.yml) because dist refuses to release when it differs from what it generates.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"swatinem/rust-cache" = "d1527c8f67ef9af357290475d4af4b0fab8f12e0" # v2.9.3
# "actions/setup-node" = "249970729cb0ef3589644e2896645e5dc5ba9c38" # v6.5.0
